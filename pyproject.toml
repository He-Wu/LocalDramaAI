[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdramaai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.7", "pydantic-settings>=2.4", "httpx>=0.27", "PyYAML>=6", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["app*", "ai_services*"]
exclude = ["tests*", "scripts*", "comfyui*", "runtime*", "models*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
